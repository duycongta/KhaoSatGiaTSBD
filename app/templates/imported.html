<!doctype html><meta charset="utf-8"><title>Đã nhập</title>
<body style="font:15px system-ui;max-width:700px;margin:20px auto">
<h2>Kết quả nhập file</h2>
<table border="1" cellpadding="6" style="border-collapse:collapse"><tr><th>File</th><th>Nguồn</th><th>Số tin đất nhập</th></tr>
{% for name,kind,n in report %}<tr><td>{{name}}</td><td>{{kind}}</td><td>{{n}}</td></tr>{% endfor %}</table>
<p>Tin trùng link được gộp. Quay lại trang chính và bấm "Khảo giá" (không cần tích thu thập mới).</p><a href="/">← Quay lại</a>
